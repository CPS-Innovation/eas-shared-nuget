stages:
  - build
  - test
  - pack
  - publish

variables:
  NUGET_FEED: "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/packages/nuget/index.json"

# Compile everything so that all referenced DLLs exist for nuspec to include
build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - dotnet restore EasSharedNuget.sln
    - dotnet build EasSharedNuget.sln -c Release
  artifacts:
    paths:
      - src/
      - test/
    expire_in: 1 hour

unit-tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  dependencies:
    - build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - dotnet test EasSharedNuget.sln -c Release --no-build --verbosity normal --filter "Category!=IntegrationTest" --logger "trx;LogFileName=unit-test-results.trx"
    - dotnet tool install -g trx2junit
    - export PATH="$PATH:/root/.dotnet/tools"
    - find . -name "*.trx" -exec trx2junit {} \;
  artifacts:
    when: always
    paths:
      - "**/*.trx"
      - "**/*.xml"
    reports:
      junit:
        - "**/*.xml"
    expire_in: 1 week

integration-tests:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  dependencies:
    - build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - dotnet test EasSharedNuget.sln -c Release --no-build --verbosity normal --filter "Category=IntegrationTest" --logger "trx;LogFileName=integration-test-results.trx"
    - |
      echo 'To run integration tests (instead of skipping), add these CI/CD variables (masked): AmazonS3__AccessKey, AmazonS3__SecretKey, AmazonS3ClientFactory__MailboxConfigurationContainerName, GraphApi__ClientId, GraphApi__ClientSecret, GraphApi__TenantId'
    - dotnet tool install -g trx2junit
    - export PATH="$PATH:/root/.dotnet/tools"
    - find . -name "*.trx" -exec trx2junit {} \;
  artifacts:
    when: always
    paths:
      - "**/*.trx"
      - "**/*.xml"
    reports:
      junit:
        - "**/*.xml"
    expire_in: 1 week

pack:
  stage: pack
  image: mcr.microsoft.com/dotnet/sdk:8.0
  dependencies:
    - build
  rules:
      - if: $CI_COMMIT_BRANCH == "main"
  script:
    - dotnet pack EasShared.Package/EasShared.Package.csproj -c Release -o ./out --verbosity normal -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg -p:EmbedUntrackedSources=true -p:EmbedAllSources=true -p:DebugType=portable
  artifacts:
    paths:
      - out/
    expire_in: 1 hour

publish:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:8.0
  dependencies:
    - pack
  rules:
      - if: $CI_COMMIT_BRANCH == "main"
  script:
    - dotnet nuget push ./out/*.nupkg --source "$NUGET_FEED" --api-key "$GITLAB_PAT"
    - dotnet nuget push ./out/*.snupkg --source "$NUGET_FEED" --api-key "$GITLAB_PAT"