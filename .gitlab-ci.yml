stages:
  - build
  - test
  - pack
  - publish

variables:
  NUGET_FEED: "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/packages/nuget/index.json"

# Compile everything so that all referenced DLLs exist for nuspec to include
build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - dotnet restore EasSharedNuget.sln
    - dotnet build EasSharedNuget.sln -c Debug
  artifacts:
    paths:
      - src/
      - test/
    expire_in: 1 hour

# Run all unit tests
test:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:8.0
  dependencies:
    - build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
  script:
    - dotnet test EasSharedNuget.sln -c Debug --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
  artifacts:
    when: always
    paths:
      - "**/*.trx"
    reports:
      junit:
        - "**/*.trx"
    expire_in: 1 week

pack:
  stage: pack
  image: mcr.microsoft.com/dotnet/sdk:8.0
  dependencies:
    - build
  rules:
      - if: $CI_COMMIT_BRANCH == "main"
  script:
    - dotnet pack EasShared.Package/EasShared.Package.csproj -c Debug -o ./out --verbosity normal
  artifacts:
    paths:
      - out/
    expire_in: 1 hour

publish:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:8.0
  dependencies:
    - pack
  rules:
      - if: $CI_COMMIT_BRANCH == "main"
  script:
    - dotnet nuget push ./out/*.nupkg --source "$NUGET_FEED" --api-key "$GITLAB_PAT"