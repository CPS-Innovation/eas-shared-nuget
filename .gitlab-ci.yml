stages:
  - build
  - pack
  - publish

variables:
  NUGET_FEED: "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/packages/nuget/index.json"

# Compile everything so that all referenced DLLs exist for nuspec to include
build:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - dotnet restore EasSharedNuget.sln
    - dotnet build EasSharedNuget.sln -c Release
  artifacts:
    paths:
      - src/
      - test/
    expire_in: 1 hour

pack:
  stage: pack
  image: mcr.microsoft.com/dotnet/sdk:8.0
  dependencies:
    - build
  script:
    - dotnet pack EasSharedNuget.csproj -c Release -o ./out --no-build --verbosity normal
  artifacts:
    paths:
      - out/
    expire_in: 1 hour

publish:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:8.0
  dependencies:
    - pack
  script:
    - dotnet nuget push ./out/*.nupkg --source "$NUGET_FEED" --api-key "$GITLAB_PAT"
